# Weekly dependency updates. Minor and patch bumps come as one grouped PR per
# ecosystem; majors stay separate, since those are the ones that need reading.
version: 2
updates:
  # The app: the version catalog in gradle/libs.versions.toml plus the wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The public backend: a standalone Gradle build (server/build.gradle.kts).
  - package-ecosystem: gradle
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The backend's base images (server/Dockerfile).
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-images:
        patterns: ["*"]
        update-types: [minor, patch]

  # Workflows under .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
