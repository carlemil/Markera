# Runs the JVM/Android unit tests, a debug build and the server tests on every push to
# master and every pull request. No iOS job: macOS runners are costly, and the iOS
# builds run on the Mac mini (see iosApp/README.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android/JVM tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The app and :vision use a Java 21 toolchain.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # best.onnx and local.properties are not committed and not needed here: the model
      # is only loaded at runtime, and local.properties values fall back to empty strings.
      # The Android SDK comes preinstalled on the runner (ANDROID_HOME).
      - name: Unit tests and debug build
        run: ./gradlew :vision:jvmTest :vision:testDebugUnitTest :composeApp:testDebugUnitTest :composeApp:assembleDebug

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # server/ is a standalone Gradle project with a Java 17 toolchain.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Server tests
        run: ./gradlew test
