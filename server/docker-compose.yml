services:
  markera-server:
    build: .
    ports:
      - "127.0.0.1:8090:8080"  # plain HTTP only for the host Caddy (https://markera.duckdns.org)
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/markera.db
      TZ: Europe/Stockholm
    volumes:
      - markera-data:/data

volumes:
  markera-data:
