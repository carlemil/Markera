# Xcode project definition; `xcodegen generate` (in this directory) writes the
# gitignored iosApp.xcodeproj. scripts/mac-build.sh does that and builds.
name: iosApp
options:
  bundleIdPrefix: se.kjellstrand
  deploymentTarget:
    # Must equal the ORT xcframework's MinimumOSVersion: Xcode embeds the static
    # package as a codeless framework whose stub is built for this target, and
    # App Store processing rejects a stub newer than the framework's plist
    # (ITMS-90208).
    iOS: "15.1"
  createIntermediateGroups: true
packages:
  # ORT Objective-C bindings; main carries the 1.24.2 binaries (the newest tag
  # is still 1.19.2), so it is pinned by commit.
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    revision: b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The detection model, shared with the Android assets (gitignored, ~40 MB).
      - path: ../composeApp/src/androidMain/assets/best.onnx
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    # Untracked: DEVELOPMENT_TEAM (copy Local.xcconfig.example).
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Markera
        # xcodegen writes 1.0 / 1 unless told to follow the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        CADisableMinimumFrameDurationOnPhone: true   # Compose aborts at start without it
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Markera fotograferar måltavlan för att räkna träffarna.
        NSPhotoLibraryUsageDescription: Markera kan räkna träffarna på ett sparat foto av måltavlan.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MarkeraBackendUrl: $(MARKERA_BACKEND_URL)
        MarkeraDevAuth: $(MARKERA_DEV_AUTH)
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kjellstrand.markera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.6.0
        CURRENT_PROJECT_VERSION: 9
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # The Kotlin framework, copied here by embedAndSignAppleFrameworkForXcode.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp -lsqlite3
      configs:
        Debug:
          MARKERA_BACKEND_URL: http://127.0.0.1:8091
          MARKERA_DEV_AUTH: "YES"
        Release:
          MARKERA_BACKEND_URL: https://markera.duckdns.org
          MARKERA_DEV_AUTH: "NO"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export PATH=/opt/homebrew/bin:$PATH
          export JAVA_HOME=${JAVA_HOME:-$(/usr/libexec/java_home)}
          cd "$SRCROOT/.."
          sh gradlew :composeApp:embedAndSignAppleFrameworkForXcode
